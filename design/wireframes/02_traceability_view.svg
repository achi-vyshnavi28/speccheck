<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>02 Traceability view (built)</title><rect width="1280" height="800" fill="#ffffff"/><rect width="280" height="800" fill="#f0f2f6"/><text x="24" y="50" fill="#1c2330" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, Arial">Input</text><text x="24" y="84" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">PRD source</text><text x="24" y="108" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">● Sample PRD   ○ Paste your own</text><rect x="24" y="124" width="230" height="36" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="36" y="147" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">PRD-2.0 capa management</text><text x="310" y="60" fill="#1c2330" font-size="32" font-weight="700" text-anchor="start" font-family="Inter, Arial">SpecCheck</text><text x="310" y="86" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Finds the requirements a tester can't test, before development starts.</text><text x="310" y="130" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Requirement gaps</text><text x="450" y="130" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Draft test cases</text><text x="590" y="130" fill="#ff4b4b" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Traceability</text><rect x="590" y="138" width="84" height="3" fill="#ff4b4b"/><text x="702" y="130" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Export</text><text x="772" y="130" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Evaluation</text><line x1="310" y1="141" x2="1250" y2="141" stroke="#d0d5dd"/><rect x="310" y="165" width="940" height="240" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="320" y="188" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Story</text><text x="410" y="188" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">AC</text><text x="450" y="188" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Acceptance criterion</text><text x="860" y="188" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Test cases</text><text x="1020" y="188" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Open gaps</text><text x="1190" y="188" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Covered</text><line x1="310" y1="201" x2="1250" y2="201" stroke="#d0d5dd"/><text x="320" y="223" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">CAPA-201</text><text x="410" y="223" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">1</text><text x="450" y="223" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">The CAPA copies the deviation number, product and root cause…</text><text x="860" y="223" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">TC-201-01</text><text x="1020" y="223" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">-</text><text x="1190" y="223" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">yes</text><rect x="311" y="235" width="938" height="34" fill="#fff4e0"/><line x1="310" y1="235" x2="1250" y2="235" stroke="#d0d5dd"/><text x="320" y="257" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">CAPA-202</text><text x="410" y="257" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">2</text><text x="450" y="257" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Due dates must be reasonable.</text><text x="860" y="257" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">TC-202-03, TC-202-05</text><text x="1020" y="257" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">vague term</text><text x="1190" y="257" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">assumed</text><rect x="311" y="269" width="938" height="34" fill="#fff4e0"/><line x1="310" y1="269" x2="1250" y2="269" stroke="#d0d5dd"/><text x="320" y="291" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">CAPA-203</text><text x="410" y="291" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">2</text><text x="450" y="291" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Escalations happen quickly.</text><text x="860" y="291" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">TC-203-01, TC-203-03</text><text x="1020" y="291" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">vague term</text><text x="1190" y="291" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">assumed</text><line x1="310" y1="303" x2="1250" y2="303" stroke="#d0d5dd"/><text x="320" y="325" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">CAPA-204</text><text x="410" y="325" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">1</text><text x="450" y="325" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">A CAPA cannot be closed while any action is open.</text><text x="860" y="325" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">TC-204-01, TC-204-02</text><text x="1020" y="325" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">-</text><text x="1190" y="325" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">yes</text><rect x="311" y="337" width="938" height="34" fill="#fff4e0"/><line x1="310" y1="337" x2="1250" y2="337" stroke="#d0d5dd"/><text x="320" y="359" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">CAPA-205</text><text x="410" y="359" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">1</text><text x="450" y="359" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">The owner can edit any field of a closed CAPA.</text><text x="860" y="359" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">TC-205-01 … 04</text><text x="1020" y="359" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">gxp control missing</text><text x="1190" y="359" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">assumed</text><rect x="311" y="371" width="938" height="34" fill="#fce4e4"/><line x1="310" y1="371" x2="1250" y2="371" stroke="#d0d5dd"/><text x="320" y="393" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">CAPA-206</text><text x="410" y="393" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">3</text><text x="450" y="393" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">TBD: what happens if the CAPA was not effective.</text><text x="860" y="393" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">-</text><text x="1020" y="393" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">placeholder</text><text x="1190" y="393" fill="#b42318" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">NO</text><text x="310" y="420" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">1 of 15 criteria has no test case (the TBD). 5 more are 'assumed': tested, but their tests rest on</text><text x="310" y="440" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">assumptions until product answers the open gap: coverage alone would call them done.</text><rect x="930" y="470" width="320" height="106" rx="6" fill="#fffbe6" stroke="#f5c542"/><text x="942" y="492" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Red: no test. Amber: tested, but the</text><text x="942" y="512" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">expected result was assumed because the</text><text x="942" y="532" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">criterion is vague. That's the risk a</text><text x="942" y="552" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">plain coverage % hides.</text></svg>