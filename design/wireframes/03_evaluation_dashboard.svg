<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>03 Evaluation dashboard (proposal)</title><rect width="1280" height="800" fill="#ffffff"/><rect width="280" height="800" fill="#f0f2f6"/><text x="24" y="50" fill="#1c2330" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, Arial">Input</text><text x="24" y="84" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">PRD source</text><text x="24" y="108" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">● Sample PRD   ○ Paste your own</text><rect x="24" y="124" width="230" height="36" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="36" y="147" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">PRD-2.0 capa management</text><text x="310" y="60" fill="#1c2330" font-size="32" font-weight="700" text-anchor="start" font-family="Inter, Arial">SpecCheck</text><text x="310" y="86" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Finds the requirements a tester can't test, before development starts.</text><text x="310" y="130" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Requirement gaps</text><text x="450" y="130" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Draft test cases</text><text x="590" y="130" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Traceability</text><text x="702" y="130" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Export</text><text x="772" y="130" fill="#ff4b4b" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Evaluation</text><rect x="772" y="138" width="70" height="3" fill="#ff4b4b"/><line x1="310" y1="141" x2="1250" y2="141" stroke="#d0d5dd"/><text x="310" y="180" fill="#1c2330" font-size="15" font-weight="600" text-anchor="start" font-family="Inter, Arial">Held-out set: 60 requirements written after the rules were frozen</text><rect x="310" y="195" width="220" height="80" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="326" y="222" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Rules precision</text><text x="326" y="258" fill="#1c2330" font-size="28" font-weight="700" text-anchor="start" font-family="Inter, Arial">90%</text><rect x="545" y="195" width="220" height="80" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="561" y="222" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Rules recall</text><text x="561" y="258" fill="#1c2330" font-size="28" font-weight="700" text-anchor="start" font-family="Inter, Arial">70%</text><rect x="780" y="195" width="220" height="80" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="796" y="222" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Rules + LLM recall</text><text x="796" y="258" fill="#1c2330" font-size="28" font-weight="700" text-anchor="start" font-family="Inter, Arial">100%</text><rect x="1015" y="195" width="220" height="80" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="1031" y="222" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">False alarms (rules)</text><text x="1031" y="258" fill="#1c2330" font-size="28" font-weight="700" text-anchor="start" font-family="Inter, Arial">0%</text><text x="310" y="310" fill="#1c2330" font-size="14" font-weight="600" text-anchor="start" font-family="Inter, Arial">Where the rules miss most (share of labelled defects missed, by area)</text><text x="310" y="339" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Calibration and maintenance</text><rect x="560" y="325" width="300" height="20" rx="3" fill="#f2f4f7" stroke="#f2f4f7"/><rect x="560" y="325" width="225" height="20" rx="3" fill="#b42318" stroke="#b42318"/><text x="870" y="340" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">75%</text><text x="310" y="371" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Serialization</text><rect x="560" y="357" width="300" height="20" rx="3" fill="#f2f4f7" stroke="#f2f4f7"/><rect x="560" y="357" width="201" height="20" rx="3" fill="#b42318" stroke="#b42318"/><text x="870" y="372" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">67%</text><text x="310" y="403" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Pharmacovigilance</text><rect x="560" y="389" width="300" height="20" rx="3" fill="#f2f4f7" stroke="#f2f4f7"/><rect x="560" y="389" width="120" height="20" rx="3" fill="#f5a623" stroke="#f5a623"/><text x="870" y="404" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">40%</text><text x="310" y="435" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Warehouse and materials</text><rect x="560" y="421" width="300" height="20" rx="3" fill="#f2f4f7" stroke="#f2f4f7"/><rect x="560" y="421" width="120" height="20" rx="3" fill="#f5a623" stroke="#f5a623"/><text x="870" y="436" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">40%</text><text x="310" y="467" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Environmental monitoring</text><rect x="560" y="453" width="300" height="20" rx="3" fill="#f2f4f7" stroke="#f2f4f7"/><rect x="560" y="453" width="60" height="20" rx="3" fill="#f5a623" stroke="#f5a623"/><text x="870" y="468" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">20%</text><text x="310" y="499" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Complaints and recalls</text><rect x="560" y="485" width="300" height="20" rx="3" fill="#f2f4f7" stroke="#f2f4f7"/><rect x="560" y="485" width="0" height="20" rx="3" fill="#1a7f4b" stroke="#1a7f4b"/><text x="870" y="500" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">0%</text><text x="310" y="540" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Source: evals/questions.sql (Q2) over evals/eval.sqlite</text><rect x="930" y="330" width="320" height="106" rx="6" fill="#fffbe6" stroke="#f5c542"/><text x="942" y="352" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Turns the SQL answers into a page PMs</text><text x="942" y="372" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">can read: where to extend the rule</text><text x="942" y="392" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">vocabulary next, and what each</text><text x="942" y="412" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">reviewer (rules vs LLM) costs.</text></svg>