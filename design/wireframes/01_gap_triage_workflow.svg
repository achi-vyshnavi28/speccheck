<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>01 Gap triage workflow (proposal)</title><rect width="1280" height="800" fill="#ffffff"/><rect width="280" height="800" fill="#f0f2f6"/><text x="24" y="50" fill="#1c2330" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, Arial">Input</text><text x="24" y="84" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">PRD source</text><text x="24" y="108" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">● Sample PRD   ○ Paste your own</text><rect x="24" y="124" width="230" height="36" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="36" y="147" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">PRD-2.0 capa management</text><text x="310" y="60" fill="#1c2330" font-size="32" font-weight="700" text-anchor="start" font-family="Inter, Arial">SpecCheck</text><text x="310" y="86" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Finds the requirements a tester can't test, before development starts.</text><text x="310" y="130" fill="#ff4b4b" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Requirement gaps</text><rect x="310" y="138" width="112" height="3" fill="#ff4b4b"/><text x="450" y="130" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Draft test cases</text><text x="590" y="130" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Traceability</text><text x="702" y="130" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Export</text><text x="772" y="130" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Evaluation</text><line x1="310" y1="141" x2="1250" y2="141" stroke="#d0d5dd"/><rect x="310" y="160" width="940" height="40" rx="6" fill="#fce4e4" stroke="#b42318"/><text x="326" y="186" fill="#b42318" font-size="14" font-weight="600" text-anchor="start" font-family="Inter, Arial">NOT ready for development: 9 gaps (2 blocking) · 2 accepted · 1 rejected · 6 awaiting product</text><rect x="310" y="215" width="940" height="206" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="320" y="238" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Story</text><text x="405" y="238" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Sev.</text><text x="470" y="238" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Rule</text><text x="610" y="238" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Requirement</text><text x="1000" y="238" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Decision</text><text x="1090" y="238" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Owner / reason</text><line x1="310" y1="251" x2="1250" y2="251" stroke="#d0d5dd"/><text x="320" y="273" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">CAPA-205</text><text x="405" y="273" fill="#b42318" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">high</text><text x="470" y="273" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">gxp control missing</text><text x="610" y="273" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">The owner can edit any field of a closed CAPA.</text><text x="1000" y="273" fill="#1a7f4b" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Accepted</text><text x="1090" y="273" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Meera (PM)</text><line x1="310" y1="285" x2="1250" y2="285" stroke="#d0d5dd"/><text x="320" y="307" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">CAPA-206</text><text x="405" y="307" fill="#b42318" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">high</text><text x="470" y="307" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">placeholder</text><text x="610" y="307" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">TBD: what happens if the CAPA was not effective.</text><text x="1000" y="307" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Open</text><text x="1090" y="307" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">–</text><line x1="310" y1="319" x2="1250" y2="319" stroke="#d0d5dd"/><text x="320" y="341" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">CAPA-202</text><text x="405" y="341" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">medium</text><text x="470" y="341" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">vague term</text><text x="610" y="341" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Due dates must be reasonable.</text><text x="1000" y="341" fill="#1a7f4b" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Accepted</text><text x="1090" y="341" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Meera (PM)</text><line x1="310" y1="353" x2="1250" y2="353" stroke="#d0d5dd"/><text x="320" y="375" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">CAPA-203</text><text x="405" y="375" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">medium</text><text x="470" y="375" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">vague term</text><text x="610" y="375" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Escalations happen quickly.</text><text x="1000" y="375" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Open</text><text x="1090" y="375" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">–</text><line x1="310" y1="387" x2="1250" y2="387" stroke="#d0d5dd"/><text x="320" y="409" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">CAPA-202</text><text x="405" y="409" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">low</text><text x="470" y="409" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">weak modal</text><text x="610" y="409" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">The assignee should receive a notification.</text><text x="1000" y="409" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Rejected</text><text x="1090" y="409" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Optional by design</text><text x="310" y="440" fill="#1c2330" font-size="14" font-weight="600" text-anchor="start" font-family="Inter, Arial">Selected: CAPA-203 "Escalations happen quickly."</text><rect x="310" y="452" width="620" height="60" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="322" y="476" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Reason (required to reject; kept in the review history)</text><rect x="310" y="525" width="190" height="30" rx="6" fill="#1a7f4b" stroke="#1a7f4b"/><text x="405.0" y="545" fill="#fff" font-size="12" font-weight="600" text-anchor="middle" font-family="Inter, Arial">Accept → create Jira task</text><rect x="510" y="525" width="150" height="30" rx="6" fill="#fff" stroke="#d0d5dd"/><text x="585.0" y="545" fill="#1c2330" font-size="12" font-weight="600" text-anchor="middle" font-family="Inter, Arial">Reject with reason</text><rect x="670" y="525" width="150" height="30" rx="6" fill="#fff" stroke="#d0d5dd"/><text x="745.0" y="545" fill="#1c2330" font-size="12" font-weight="600" text-anchor="middle" font-family="Inter, Arial">Assign to product</text><rect x="930" y="560" width="320" height="106" rx="6" fill="#fffbe6" stroke="#f5c542"/><text x="942" y="582" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Why: every decision becomes a new, independent</text><text x="942" y="602" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">label (the README's biggest limitation).</text><text x="942" y="622" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Rejected gaps feed the next rule review;</text><text x="942" y="642" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">accepted ones go straight to Jira.</text></svg>